worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    upstream backend {
        server 127.0.0.1:8080;
    }

    # Redirection HTTP → HTTPS
    server {
        listen 80;
        server_name activeducation.tg www.activeducation.tg;
        return 301 https://$host$request_uri;
    }

    # Serveur HTTPS
    server {
        listen 443 ssl http2;
        server_name activeducation.tg www.activeducation.tg;

        # SSL (remplacer par tes certificats Let's Encrypt)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Sécurité
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

        # Logs
        access_log /var/log/nginx/activ_access.log;
        error_log  /var/log/nginx/activ_error.log;

        # API Backend — proxy vers Spring Boot
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;

            # Upload taille max
            client_max_body_size 25M;
        }

        # WebSocket Chat
        location /ws/chat {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Swagger / API Docs
        location /swagger-ui.html {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
        location /v3/api-docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
        location /swagger-ui/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Santé Actuator
        location /actuator/health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Fichiers statiques (Frontend React)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache des assets statiques
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
