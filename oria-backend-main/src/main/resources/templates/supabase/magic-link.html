<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { font-family: 'Inter', Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
.container { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
.header { background: linear-gradient(135deg, #3133DD, #1E1F7A); padding: 32px 24px; text-align: center; }
.header h1 { color: #fff; margin: 0; font-size: 20px; font-weight: 700; }
.body { padding: 32px 24px; text-align: center; }
.body p { color: #333; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
.btn { display: inline-block; background: #3133DD; color: #fff !important; text-decoration: none; padding: 14px 48px; border-radius: 8px; font-weight: 600; font-size: 15px; }
.btn:hover { background: #1E1F7A; }
.info { color: #666; font-size: 13px; line-height: 1.6; margin-top: 24px; }
.footer { text-align: center; padding: 24px; border-top: 1px solid #eee; color: #999; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Connexion à ORIA</h1>
</div>
<div class="body">
<p>Bonjour,<br>Utilisez ce lien pour vous connecter à votre compte <strong>ORIA</strong> :</p>
<p><a href="{{ .ConfirmationURL }}" class="btn">Se connecter</a></p>
<p class="info">Ce lien est valable 1 heure et expire après utilisation.<br>Si vous n'avez pas demandé cette connexion, ignorez cet email.</p>
</div>
<div class="footer">
<p>ORIA par </p>
<p>Cet email est automatique, merci de ne pas y répondre.</p>
</div>
</div>
</body>
</html>
