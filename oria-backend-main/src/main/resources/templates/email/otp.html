<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<style>
body { font-family: 'Inter', Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
.container { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
.header { background: linear-gradient(135deg, #3133DD, #1E1F7A); padding: 32px 24px; text-align: center; }
.header h1 { color: #fff; margin: 0; font-size: 20px; font-weight: 700; }
.header p { color: rgba(255,255,255,0.7); margin: 8px 0 0; font-size: 14px; }
.body { padding: 32px 24px; }
.code { text-align: center; margin: 24px 0; }
.code span { display: inline-block; background: #F0F0FF; color: #3133DD; font-size: 36px; font-weight: 800; letter-spacing: 8px; padding: 16px 32px; border-radius: 12px; }
.info { color: #666; font-size: 13px; line-height: 1.6; text-align: center; margin-top: 16px; }
.footer { text-align: center; padding: 24px; border-top: 1px solid #eee; color: #999; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Code de vérification</h1>
<p th:text="'Bonjour ' + ${prenom} + ','">Bonjour,</p>
</div>
<div class="body">
<p style="text-align:center;color:#333;font-size:14px;margin:0;">
Utilisez ce code pour réinitialiser votre mot de passe :
</p>
<div class="code">
<span th:text="${code}">0000</span>
</div>
<p class="info">
Ce code est valable <strong>5 minutes</strong>.<br>
Si vous n'avez pas demandé cette réinitialisation, ignorez cet email.
</p>
</div>
<div class="footer">
<p>ORIA par Activ Education</p>
<p>Cet email est automatique, merci de ne pas y répondre.</p>
</div>
</div>
</body>
</html>
