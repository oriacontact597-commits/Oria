# Supabase PostgreSQL (dev也用Supabase)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=disable
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

# Redis — déprécié (Supabase gère)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

# MinIO — déprécié (remplacé par Supabase Storage)
minio.url=http://localhost:9000
minio.access-key=minio
minio.secret-key=${MINIO_SECRET_KEY}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

security.jwt.secret=${JWT_SECRET}
openai.api.key=${OPENAI_API_KEY}
openai.api.chat.url=https://api.groq.com/openai/v1/chat/completions
openai.api.chat.key=${OPENAI_CHAT_KEY:}
openai.api.chat.model=openai/gpt-oss-120b

# Limites élevées pour le développement
rate.limit.login.max=99999
rate.limit.refresh.max=99999
rate.limit.api.max=99999

# Supabase
supabase.url=${SUPABASE_URL}
supabase.jwks-url=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
