version: '3.8'

services:
  # 1. Base de données PostgreSQL + pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: activeducation-db
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_DB: activ_education
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432" # Pas d'exposition publique
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./seed/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activ_education"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Cache Redis
  redis:
    image: redis:7-alpine
    container_name: activeducation-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379" # Pas d'exposition publique
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Stockage objet MinIO
  minio:
    image: minio/minio:latest
    container_name: activeducation-minio
    restart: unless-stopped
    env_file: .env.prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"  # API S3 (interne)
      - "127.0.0.1:9001:9001"  # Console admin (interne)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Application Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: activeducation-app
    restart: unless-stopped
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: activ_education
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080" # Exposé seulement à Nginx
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # 5. Nginx (Reverse Proxy + Frontend React)
  nginx:
    image: nginx:1.27-alpine
    container_name: activeducation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro                # Certificats SSL
      - ../activ-education-fronted-main/backoffice/dist:/usr/share/nginx/html:ro  # Build React
    depends_on:
      - app

volumes:
  db_data:
  redis_data:
  minio_data:
