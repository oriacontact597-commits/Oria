input {
  tcp {
    port => 5000
    codec => json
  }

  udp {
    port => 5000
    codec => json
  }
}

filter {
  if [message] {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  if [logger] {
    mutate {
      rename => { "logger" => "logger_name" }
    }
  }

  if [level] {
    mutate {
      rename => { "level" => "log_level" }
    }
  }

  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "activ-education-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
