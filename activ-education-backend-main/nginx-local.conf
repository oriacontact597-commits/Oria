worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name localhost;

        access_log /var/log/nginx/activ_local.log;
        error_log  /var/log/nginx/activ_local.log;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        # API Backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            client_max_body_size 25M;
        }

        # WebSocket Chat
        location /ws/chat {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Swagger
        location /swagger-ui.html { proxy_pass http://backend; }
        location /v3/api-docs { proxy_pass http://backend; }
        location /swagger-ui/ { proxy_pass http://backend; }
        location /actuator/health { proxy_pass http://backend; }

        # Files download
        location /files/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Frontend React
        location / {
            root /var/www/activeducation;
            index index.html;
            try_files $uri $uri/ /index.html;
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }

    # Flutter Web Mobile
    server {
        listen 80;
        listen 8081;
        server_name m.activ-education.local *.nip.io;

        access_log /var/log/nginx/activ_mobile.log;
        error_log  /var/log/nginx/activ_mobile.log;

        # API Backend (proxy partagé)
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            client_max_body_size 25M;
        }

        location /swagger-ui.html { proxy_pass http://backend; }
        location /v3/api-docs { proxy_pass http://backend; }
        location /swagger-ui/ { proxy_pass http://backend; }
        location /actuator/health { proxy_pass http://backend; }
        location /files/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Flutter Web App
        location / {
            root /var/www/activeducation-mobile;
            index index.html;
            try_files $uri $uri/ /index.html;
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
