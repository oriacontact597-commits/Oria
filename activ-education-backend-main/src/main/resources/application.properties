spring.application.name=activEducation

# Charge .env automatiquement (DotenvEnvironmentPostProcessor via META-INF/spring.factories)
springdotenv.filename=.env
springdotenv.ignore-if-missing=true

# PostgreSQL (dev local)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway (schema migrations — coexists with ddl-auto=update during transition)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Bean Validation (JPA/Hibernate)
spring.jpa.properties.jakarta.persistence.validation.mode=auto
spring.jpa.properties.hibernate.validator.fail_fast=true

# Spring Cache (Redis back-end pour le SEP)
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=oria:sep:
spring.cache.redis.use-key-prefix=true

# Server
server.port=${SERVER_PORT:8080}

# Logs
logging.level.root=INFO
logging.level.tg.edtch.activEducation=DEBUG

# Swagger / OpenAPI (springdoc)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false
springdoc.packages-to-scan=tg.edtch.activEducation
springdoc.paths-to-match=/**
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# MinIO
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket.images=${MINIO_BUCKET_IMAGES:activeducation-images}
minio.bucket.videos=${MINIO_BUCKET_VIDEOS:activeducation-videos}
minio.bucket.documents=${MINIO_BUCKET_DOCUMENTS:activeducation-documents}

# Configuration Multipart (Upload de fichiers)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Ollama (provider local ORIA — prioritaire)
ollama.api.url=${OLLAMA_URL:http://localhost:11434}
ollama.api.model=${OLLAMA_MODEL:mistral:7b-instruct}
ollama.api.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
# Provider d'embedding : 'ollama' (local, gratuit) ou vide (= OpenAI via clé)
embedding.provider=${EMBEDDING_PROVIDER:ollama}

# ORIA RAG : active la recherche vectorielle pgvector (désactivé si pgvector indispo)
oria.rag.vectoriel=${ORIA_RAG_VECTORIEL:false}

# Groq (fallback ORIA)
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_MODEL:llama-3.1-8b-instant}

# OpenAI (fallback ORIA + Vocal)
openai.api.key=${OPENAI_API_KEY:}
openai.api.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.api.chat.url=${OPENAI_CHAT_URL:https://api.openai.com/v1/chat/completions}
openai.api.chat.key=${OPENAI_CHAT_KEY:${openai.api.key}}
openai.api.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
openai.api.whisper.model=${OPENAI_WHISPER_MODEL:whisper-1}
openai.api.tts.model=${OPENAI_TTS_MODEL:tts-1}
openai.api.tts.voice=${OPENAI_TTS_VOICE:alloy}

# Thymeleaf
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Mail (SMTP OTP)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
smtp.from=${SMTP_FROM:noreply@oria.activeducation.tg}

# Sécurité (JWT)
security.jwt.secret=${JWT_SECRET}
# 15 min (par défaut)
security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# 7 jours (par défaut)
security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
security.jwt.issuer=activ-education

# Redis (Rate Limiting & Token Blacklist)
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Rate Limiting
rate.limit.login.max=${RATE_LIMIT_LOGIN_MAX:20}
rate.limit.login.window-minutes=${RATE_LIMIT_LOGIN_WINDOW:15}
rate.limit.refresh.max=${RATE_LIMIT_REFRESH_MAX:20}
rate.limit.refresh.window-minutes=${RATE_LIMIT_REFRESH_WINDOW:5}
rate.limit.api.max=${RATE_LIMIT_API_MAX:200}
rate.limit.api.window-minutes=${RATE_LIMIT_API_WINDOW:1}

# Visioconférence (Jitsi Meet)
visio.provider=jitsi
visio.jitsi.base-url=https://meet.jit.si

# ─── Module Prédiction (Phase 3) — Moteur 3 signaux ────────────────────────
# Pondération recommandée par RESULTATS_PROTOTYPE.md (pondération "avec_comportemental_v2") :
#   score_final = 0.50·realite + 0.35·aspiration + 0.15·engagement
# Le plafond poidsEngagementMax est un garde-fou "anti bulle de filtre" :
#   le moteur utilise min(poidsEngagement, poidsEngagementMax) même si la config dépasse.
app.prediction.poids-aspiration=0.35
app.prediction.poids-realite=0.50
app.prediction.poids-engagement=0.15
app.prediction.poids-engagement-max=0.20
app.prediction.top-n=10
app.prediction.decouvertes-min=2
app.prediction.seuil-admission-defaut=12.0

# Supabase (Auth JWT validation)
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.jwks-url=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
